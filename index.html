<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Title, description, addresses in each language and link previews: written for each page by scripts/prerender.js -->
    <!--page-->
    <title>Work&amp;Walk — Planning, pas et salaire sur iPhone</title>
    <!--/page-->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Smart App Banner (Safari on iPhone) -->
    <meta name="apple-itunes-app" content="app-id=6759506295" />
    <meta name="apple-mobile-web-app-title" content="Work&Walk" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="color-scheme" content="dark" />

    <script>
      // Runs before the page is drawn.
      (function (doc, loc) {
        // Sections that appear as they scroll into view are only hidden when scripts run.
        doc.documentElement.classList.add('js')
        // Links from the former single-page setup (/?/privacy) lead to the page itself.
        if (loc.search.indexOf('?/') === 0) {
          loc.replace(loc.search.slice(1).split('&').map(function (part) { return part.replace(/~and~/g, '&') }).join('?') + loc.hash)
          return
        }
        // A visitor who picked a language gets the same page in it (see src/langPreference.js).
        try {
          var saved = localStorage.getItem('ww-lang')
          var path = loc.pathname
          var english = /^\/en(\/|$)/.test(path)
          if (saved === (english ? 'fr' : 'en')) {
            loc.replace((english ? path.replace(/^\/en/, '') || '/' : '/en' + (path === '/' ? '/' : path)) + loc.search + loc.hash)
          }
        } catch (error) { /* storage unavailable */ }
      })(document, location)
    </script>
    <noscript><style>.stage-placeholder { display: none !important; }</style></noscript>
    <style>html { background: #0a0908; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
